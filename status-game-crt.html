<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>STATUS — CRT sample</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:'Space Mono',monospace; }

  #app{
    width:90vw; height:90vh;
    background:#04120a;
    border:2px solid #1a3a24;
    border-radius:14px;
    position:relative;
    overflow:hidden;
    display:grid;
    grid-template-rows:56px 1fr;
    grid-template-columns:200px 1fr;
    box-shadow:0 0 0 6px #000, 0 0 60px rgba(60,255,140,.15), 0 40px 100px rgba(0,0,0,.9);
  }
  /* CRT curvature vignette */
  #app::before{
    content:''; position:absolute; inset:0; z-index:30; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  /* scanlines */
  #app::after{
    content:''; position:absolute; inset:0; z-index:31; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0px, rgba(0,0,0,.35) 1px, transparent 2px, transparent 3px);
    mix-blend-mode:multiply;
    animation:flicker 6s infinite;
  }
  @keyframes flicker{ 0%,100%{opacity:.9} 50%{opacity:1} 52%{opacity:.85} }

  .green{ color:#5cff9d; text-shadow:0 0 6px rgba(92,255,157,.7), 0 0 14px rgba(92,255,157,.3); }
  .amber{ color:#ffc65c; text-shadow:0 0 6px rgba(255,198,92,.7); }

  #header{ grid-column:1/3; display:flex; align-items:center; padding:0 18px; border-bottom:2px solid #1a3a24; gap:12px; }
  #header .title{ font-weight:700; letter-spacing:4px; font-size:15px; }
  #header .rec{ margin-left:auto; font-size:10px; letter-spacing:2px; padding:4px 10px; border:1px solid #5cff9d; border-radius:20px; }
  #header .rec::before{ content:'● '; }

  #sidebar{ border-right:2px solid #1a3a24; padding:16px 0; display:flex; flex-direction:column; gap:2px; }
  #sidebar span{ display:block; padding:10px 18px; font-size:12px; letter-spacing:3px; color:rgba(92,255,157,.4); cursor:pointer; }
  #sidebar span.on{ color:#5cff9d; background:rgba(92,255,157,.08); border-left:3px solid #5cff9d; text-shadow:0 0 8px rgba(92,255,157,.6); }

  #main{ display:flex; flex-direction:column; min-height:0; padding:14px 16px; gap:10px; overflow:hidden; }
  #main h2{ font-size:13px; letter-spacing:3px; }
  .filterbar{ display:flex; gap:8px; flex-wrap:wrap; }
  .filterbar input, .filterbar select, .filterbar button{
    background:#08200f; border:1px solid #1a3a24; color:#5cff9d; font-family:inherit; font-size:10px; padding:6px 10px; letter-spacing:1px;
  }
  .filterbar input{ flex:1; min-width:120px; }
  .filterbar button{ cursor:pointer; }
  .filterbar button:hover{ border-color:#5cff9d; }

  .statsbar{ display:flex; gap:16px; font-size:10px; letter-spacing:1px; color:rgba(92,255,157,.6); flex-wrap:wrap; }
  .statsbar b{ color:#5cff9d; }

  .grid{ flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; padding-right:4px; }
  .card{ background:#08200f; border:1px solid #1a3a24; }
  .card .thumb{ height:110px; background:#04120a; position:relative; overflow:hidden; }
  .card .thumb img{ width:100%; height:100%; object-fit:cover; filter:saturate(1.3) contrast(1.05); }
  .card .id{ padding:6px 8px 2px; font-size:10px; font-weight:700; letter-spacing:1px; }
  .card .vbtns{ display:flex; gap:2px; padding:6px 8px; }
  .card .vbtns span{ flex:1; text-align:center; font-size:8px; padding:4px 0; border:1px solid #1a3a24; letter-spacing:1px; }
  .card .vbtns span.on{ background:#5cff9d; color:#04120a; border-color:#5cff9d; font-weight:700; }

  .scroll::-webkit-scrollbar{ width:6px; }
  .scroll::-webkit-scrollbar-thumb{ background:#1a3a24; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span class="title green">SET TEAM — STATUS</span>
    <span class="rec amber">REC · LIVE</span>
  </div>
  <div id="sidebar">
    <span>SCHEDULE</span>
    <span>GUIDE</span>
    <span class="on">STATUS</span>
    <span>LOG</span>
    <span>THREAD</span>
    <span>EXHIBIT</span>
    <span>IDEA</span>
    <span>DEV</span>
  </div>
  <div id="main">
    <h2 class="green">◆ STATUS — 전체 보기</h2>
    <div class="filterbar">
      <input placeholder="검색 (ID · DIR · 사유)">
      <select><option>전체 판정</option></select>
      <select><option>전체 폴더</option></select>
      <button>🔄 LIVE LOAD</button>
      <button>⬇ DOWNLOAD</button>
      <button style="color:#ff6b6b;border-color:#5c2020;">🗑 DELETE</button>
    </div>
    <div class="statsbar">
      <span>전체 <b>6,422</b></span>
      <span>core <b>167</b></span>
      <span>support <b>374</b></span>
      <span>hold <b>222</b></span>
      <span>drop <b>5,659</b></span>
      <span>필터됨 <b>6,422</b></span>
    </div>
    <div class="grid scroll" id="grid"></div>
  </div>
</div>
<script>
const PHOTOS = [
  'DSCF6926','DSCF6926_1','DSCF6927','DSCF6928','DSCF6929','DSCF6932','DSCF6933','DSCF6934','DSCF6939',
  'DSCF6926','DSCF6927','DSCF6928'
];
const BASE = 'https://pub-ffca45bf1c204526a3de1b2315e479b3.r2.dev/2025/09/0928/';
const grid = document.getElementById('grid');
const VS = ['CORE','SUP','HOLD','DROP'];
grid.innerHTML = PHOTOS.map((id,i)=>`
  <div class="card">
    <div class="thumb"><img src="${BASE}t/${id}.jpg" onerror="this.style.display='none'"></div>
    <div class="id">${id}</div>
    <div class="vbtns">${VS.map((v,vi)=>`<span class="${vi===(i%4)?'on':''}">${v}</span>`).join('')}</div>
  </div>`).join('');
</script>
</body>
</html>
