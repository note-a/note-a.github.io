<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>STATUS — HUD sample</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:#03060c; display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:'Space Mono',monospace; }

  #app{
    width:90vw; height:90vh;
    background:linear-gradient(160deg,#050b16,#081326 60%,#050b16);
    position:relative;
    display:grid;
    grid-template-rows:56px 1fr;
    grid-template-columns:210px 1fr;
    clip-path:polygon(0 20px, 20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
    box-shadow:0 0 0 1px rgba(64,224,255,.5), 0 0 60px rgba(64,224,255,.15), 0 40px 100px rgba(0,0,0,.9);
  }
  #app::before{
    content:''; position:absolute; inset:0; z-index:5; pointer-events:none;
    background:
      linear-gradient(90deg, rgba(64,224,255,.06) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(0deg, rgba(64,224,255,.06) 1px, transparent 1px) 0 0/40px 40px;
    opacity:.5;
  }
  .cyan{ color:#40e0ff; text-shadow:0 0 8px rgba(64,224,255,.5); }
  .corner{ position:absolute; width:16px; height:16px; border:2px solid #40e0ff; z-index:6; }
  .corner.tl{ top:6px; left:6px; border-right:none; border-bottom:none; }
  .corner.br{ bottom:6px; right:6px; border-left:none; border-top:none; }

  #header{ grid-column:1/3; display:flex; align-items:center; padding:0 22px; border-bottom:1px solid rgba(64,224,255,.35); gap:12px; position:relative; z-index:6; }
  #header .title{ font-weight:700; letter-spacing:5px; font-size:14px; }
  #header .rec{ margin-left:auto; font-size:9px; letter-spacing:2px; padding:5px 12px; border:1px solid #40e0ff; clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px); }
  #header .rec::before{ content:'◆ '; }

  #sidebar{ border-right:1px solid rgba(64,224,255,.35); padding:20px 0; display:flex; flex-direction:column; gap:4px; position:relative; z-index:6; }
  #sidebar span{ display:block; padding:11px 22px; font-size:11px; letter-spacing:3px; color:rgba(64,224,255,.35); cursor:pointer; position:relative; }
  #sidebar span.on{ color:#40e0ff; background:rgba(64,224,255,.08); }
  #sidebar span.on::before{ content:'▸'; position:absolute; left:8px; }

  #main{ display:flex; flex-direction:column; min-height:0; padding:16px 20px; gap:12px; overflow:hidden; position:relative; z-index:6; }
  #main h2{ font-size:12px; letter-spacing:4px; }
  .filterbar{ display:flex; gap:8px; flex-wrap:wrap; }
  .filterbar input, .filterbar select, .filterbar button{
    background:rgba(64,224,255,.05); border:1px solid rgba(64,224,255,.35); color:#40e0ff; font-family:inherit; font-size:10px; padding:7px 12px; letter-spacing:1px;
    clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);
  }
  .filterbar input{ flex:1; min-width:120px; }
  .filterbar button{ cursor:pointer; }
  .filterbar button:hover{ background:rgba(64,224,255,.15); }

  .statsbar{ display:flex; gap:18px; font-size:10px; letter-spacing:1px; color:rgba(64,224,255,.5); flex-wrap:wrap; }
  .statsbar b{ color:#40e0ff; }

  .grid{ flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; padding-right:4px; }
  .card{ background:rgba(64,224,255,.04); border:1px solid rgba(64,224,255,.25); clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
  .card .thumb{ height:110px; background:#050b16; position:relative; overflow:hidden; }
  .card .thumb img{ width:100%; height:100%; object-fit:cover; }
  .card .thumb::after{ content:''; position:absolute; inset:0; box-shadow:inset 0 0 20px rgba(64,224,255,.25); pointer-events:none; }
  .card .id{ padding:7px 9px 3px; font-size:10px; font-weight:700; letter-spacing:1px; color:#40e0ff; }
  .card .vbtns{ display:flex; gap:2px; padding:6px 8px 8px; }
  .card .vbtns span{ flex:1; text-align:center; font-size:8px; padding:4px 0; border:1px solid rgba(64,224,255,.3); letter-spacing:1px; color:rgba(64,224,255,.6); }
  .card .vbtns span.on{ background:#40e0ff; color:#03060c; border-color:#40e0ff; font-weight:700; }

  .scroll::-webkit-scrollbar{ width:6px; }
  .scroll::-webkit-scrollbar-thumb{ background:rgba(64,224,255,.3); }
</style>
</head>
<body>
<div id="app">
  <div class="corner tl"></div><div class="corner br"></div>
  <div id="header">
    <span class="title cyan">SET TEAM // STATUS</span>
    <span class="rec cyan">REC · LIVE</span>
  </div>
  <div id="sidebar">
    <span>SCHEDULE</span>
    <span>GUIDE</span>
    <span class="on">STATUS</span>
    <span>LOG</span>
    <span>THREAD</span>
    <span>EXHIBIT</span>
    <span>IDEA</span>
    <span>DEV</span>
  </div>
  <div id="main">
    <h2 class="cyan">◆ STATUS — 전체 보기</h2>
    <div class="filterbar">
      <input placeholder="검색 (ID · DIR · 사유)">
      <select><option>전체 판정</option></select>
      <select><option>전체 폴더</option></select>
      <button>🔄 LIVE LOAD</button>
      <button>⬇ DOWNLOAD</button>
      <button style="color:#ff6b6b;border-color:rgba(255,107,107,.4);">🗑 DELETE</button>
    </div>
    <div class="statsbar">
      <span>전체 <b>6,422</b></span>
      <span>core <b>167</b></span>
      <span>support <b>374</b></span>
      <span>hold <b>222</b></span>
      <span>drop <b>5,659</b></span>
      <span>필터됨 <b>6,422</b></span>
    </div>
    <div class="grid scroll" id="grid"></div>
  </div>
</div>
<script>
const PHOTOS = [
  'DSCF6926','DSCF6926_1','DSCF6927','DSCF6928','DSCF6929','DSCF6932','DSCF6933','DSCF6934','DSCF6939',
  'DSCF6926','DSCF6927','DSCF6928'
];
const BASE = 'https://pub-ffca45bf1c204526a3de1b2315e479b3.r2.dev/2025/09/0928/';
const grid = document.getElementById('grid');
const VS = ['CORE','SUP','HOLD','DROP'];
grid.innerHTML = PHOTOS.map((id,i)=>`
  <div class="card">
    <div class="thumb"><img src="${BASE}t/${id}.jpg" onerror="this.style.display='none'"></div>
    <div class="id">${id}</div>
    <div class="vbtns">${VS.map((v,vi)=>`<span class="${vi===(i%4)?'on':''}">${v}</span>`).join('')}</div>
  </div>`).join('');
</script>
</body>
</html>
