<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GBAR — 후보4 LANGUAGE (발전형)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#00c385;--cy:#00e19d;--amb:#ffc23a;--vio:#b088ff;--pink:#ff6ec9;--g3:rgba(0,195,133,.5);
  --mono:'IBM Plex Mono',monospace;--px:'Press Start 2P',monospace;--kr:'Noto Sans KR',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{width:100%;min-height:100vh;background:#000;font-family:var(--mono);
  display:flex;align-items:center;justify-content:center;}
.bar{position:relative;width:100%;max-width:1200px;height:84px;overflow:hidden;background:#000;
  border:1px solid rgba(0,195,133,.34);box-shadow:0 0 0 1px rgba(0,0,0,.8),0 0 44px rgba(0,195,133,.12);}
/* 제목+문구를 한 줄로 — 바 전체 기준 세로 중앙 정렬 */
.stack{position:relative;z-index:4;height:100%;display:flex;flex-direction:row;align-items:center;
  gap:16px;padding:0 22px;overflow:hidden;}
.sep{flex:0 0 auto;width:1px;height:22px;background:rgba(0,195,133,.28);}
.scan{position:absolute;inset:0;z-index:6;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.16) 2px,rgba(0,0,0,.16) 3px);}
.corner{position:absolute;width:12px;height:12px;z-index:8;}
.corner.tl{top:3px;left:3px;border-top:1px solid var(--g);border-left:1px solid var(--g);}
.corner.tr{top:3px;right:3px;border-top:1px solid var(--g);border-right:1px solid var(--g);}
.corner.bl{bottom:3px;left:3px;border-bottom:1px solid var(--g);border-left:1px solid var(--g);}
.corner.br{bottom:3px;right:3px;border-bottom:1px solid var(--g);border-right:1px solid var(--g);}

.ttlwrap{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;}
.ttl{font-family:'Orbitron',sans-serif;font-weight:800;font-size:22px;letter-spacing:1.5px;color:#00f6e4;
  text-shadow:0 0 16px rgba(0,246,228,.65),0 0 5px rgba(0,246,228,.95);}
.ttlsub{font-size:11px;letter-spacing:1px;color:var(--g3);}
.ttlsub b{color:var(--cy);font-weight:600;}
.stat{position:absolute;top:6px;right:16px;z-index:3;display:flex;align-items:center;gap:9px;
  font-size:9.5px;letter-spacing:1px;color:var(--g3);}
.stat b{color:var(--amb);}
.coh{position:absolute;top:6px;left:16px;z-index:3;display:flex;align-items:center;gap:6px;
  font-size:9px;letter-spacing:1.2px;color:var(--g3);}
.coh b{color:var(--vio);}
.coh-bar{width:44px;height:4px;background:rgba(0,195,133,.15);position:relative;overflow:hidden;border-radius:2px;}
.coh-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--vio),var(--cy));
  transition:width .08s linear;}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--g);box-shadow:0 0 5px var(--g);
  margin-right:4px;vertical-align:middle;animation:p 1.4s ease-in-out infinite;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}

#bgcv{position:absolute;inset:0;z-index:1;opacity:.5;}
#kin{flex:1 1 auto;min-width:0;font-size:14px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-align:left;}
#kin .rc{transition:color .05s;}
#kin .cur{color:var(--cy);animation:blink .9s steps(1) infinite;}
#kin .krtxt{font-family:var(--kr);color:rgba(0,225,157,.6);margin-left:14px;}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="bar">
  <div class="scan"></div>
  <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
  <canvas id="bgcv"></canvas>
  <div class="stack">
    <div class="ttlwrap"><div class="ttl">PROJECT SET</div><div class="ttlsub">ARCHIVE TERMINAL</div></div>
    <div class="sep"></div>
    <div id="kin"></div>
  </div>
</div>
<script>
// ── 배경: 은은하게 흐르는 격자 ──
(function(){
  var cv=document.getElementById('bgcv'), ctx=cv.getContext('2d'), W=0,H=0;
  function fit(){var b=cv.parentElement.getBoundingClientRect();W=b.width;H=b.height;cv.width=W*2;cv.height=H*2;ctx.setTransform(2,0,0,2,0,0);}
  fit();window.addEventListener('resize',fit);
  var t=0;
  function draw(){
    t+=0.4;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(0,195,133,.05)';ctx.lineWidth=1;
    var off=t%30;
    for(var x=-30+off;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── 스크램블 타이포(영문) → 같은 줄에서 한글로 교체 → 다음 문장 ──
(function(){
  var el=document.getElementById('kin');
  var pairs=[
    ['Set is the world. I\'m measuring the perimeter of the set.', '집합은 세계다. 나는 집합의 둘레를 재고 있다.'],
    ['Instructions, coerced body, suspended gaze.', '지시문, 강제된 몸, 유예된 시선.'],
    ['The scale I hold is already contaminated by the world itself.', '내가 쥔 척도는 이미 세계 자체에 오염되어 있다.'],
    ['Archiving the structure of photography by halting reproduction.', '재생산을 멈춤으로써 사진의 구조를 기록한다.']
  ];
  var CH='!<>-_\\/[]{}—=+*^?#01';
  var COLORS=['#00e19d','#b088ff','#ff6ec9','#ffc23a','#00c385'];
  var li=0;

  function scrambleTo(target, kr, done){
    var frame=0, revealed=0;
    function tick(){
      frame++;
      revealed = Math.max(0, frame-14);
      var html='';
      for(var i=0;i<target.length;i++){
        if(i < revealed){
          html += '<span class="rc" style="color:'+(i<10?'#ffc23a':'#00c385')+'">'+ (target[i]===' '?'&nbsp;':target[i]) +'</span>';
        } else if(target[i]===' '){
          html += '&nbsp;';
        } else {
          var c = COLORS[Math.floor(Math.random()*COLORS.length)];
          html += '<span class="rc" style="color:'+c+'">'+CH[Math.floor(Math.random()*CH.length)]+'</span>';
        }
      }
      html += '<span class="cur">_</span><span class="krtxt" id="krtxt">'+kr+'</span>';
      el.innerHTML = html;
      if(revealed < target.length){ requestAnimationFrame(tick); }
      else { setTimeout(done, 2000); }
    }
    tick();
  }
  function loop(){ scrambleTo(pairs[li][0], pairs[li][1], function(){ li=(li+1)%pairs.length; loop(); }); }
  loop();
})();

</script>
</body>
</html>
