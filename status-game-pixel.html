<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>STATUS — Pixel sample</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; image-rendering:pixelated; }
  html,body{ width:100%; height:100%; background:#1a1030; display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:'Space Mono',monospace; }

  #app{
    width:90vw; height:90vh;
    background:#241b3e;
    position:relative;
    display:grid;
    grid-template-rows:60px 1fr;
    grid-template-columns:210px 1fr;
    box-shadow:
      0 0 0 4px #0d0820,
      6px 6px 0 4px #0d0820,
      0 40px 100px rgba(0,0,0,.9);
  }
  .pixel-font{ font-family:'Press Start 2P', monospace; }
  .yellow{ color:#ffe25c; }
  .pink{ color:#ff5c9e; }
  .cyan{ color:#5ce8ff; }

  #header{ grid-column:1/3; display:flex; align-items:center; padding:0 20px; border-bottom:4px solid #0d0820; gap:12px; background:#2e2350; }
  #header .title{ font-size:12px; letter-spacing:1px; }
  #header .rec{ margin-left:auto; font-size:8px; letter-spacing:1px; padding:8px 12px; background:#ff5c9e; color:#0d0820; border:3px solid #0d0820; box-shadow:3px 3px 0 #0d0820; }

  #sidebar{ border-right:4px solid #0d0820; padding:16px 10px; display:flex; flex-direction:column; gap:8px; background:#2e2350; }
  #sidebar span{ display:block; padding:10px 12px; font-size:9px; letter-spacing:1px; color:#8a7fb0; cursor:pointer; border:3px solid transparent; }
  #sidebar span.on{ color:#ffe25c; background:#3a2d5e; border-color:#0d0820; box-shadow:3px 3px 0 #0d0820; }

  #main{ display:flex; flex-direction:column; min-height:0; padding:18px 20px; gap:14px; overflow:hidden; }
  #main h2{ font-size:11px; letter-spacing:1px; }
  .filterbar{ display:flex; gap:10px; flex-wrap:wrap; }
  .filterbar input, .filterbar select, .filterbar button{
    background:#3a2d5e; border:3px solid #0d0820; color:#f0eaff; font-family:'Space Mono',monospace; font-size:10px; padding:8px 12px; letter-spacing:.5px;
    box-shadow:3px 3px 0 #0d0820;
  }
  .filterbar input{ flex:1; min-width:120px; }
  .filterbar button{ cursor:pointer; font-weight:700; }
  .filterbar button:active{ box-shadow:1px 1px 0 #0d0820; transform:translate(2px,2px); }

  .statsbar{ display:flex; gap:14px; font-size:9px; letter-spacing:.5px; color:#b8a8e0; flex-wrap:wrap; }
  .statsbar b{ color:#ffe25c; }

  .grid{ flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; padding-right:4px; }
  .card{ background:#3a2d5e; border:3px solid #0d0820; box-shadow:4px 4px 0 #0d0820; }
  .card .thumb{ height:110px; background:#1a1030; position:relative; overflow:hidden; border-bottom:3px solid #0d0820; }
  .card .thumb img{ width:100%; height:100%; object-fit:cover; filter:saturate(1.4) contrast(1.1); }
  .card .id{ padding:8px 9px 4px; font-size:9px; font-weight:700; letter-spacing:.5px; color:#ffe25c; }
  .card .vbtns{ display:flex; gap:3px; padding:6px 8px 8px; }
  .card .vbtns span{ flex:1; text-align:center; font-size:7px; padding:5px 0; border:2px solid #0d0820; letter-spacing:.5px; background:#241b3e; color:#8a7fb0; }
  .card .vbtns span.on{ background:#ff5c9e; color:#0d0820; font-weight:700; }

  .scroll::-webkit-scrollbar{ width:8px; }
  .scroll::-webkit-scrollbar-thumb{ background:#0d0820; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span class="title pixel-font yellow">SET STATUS</span>
    <span class="rec pixel-font">● LIVE</span>
  </div>
  <div id="sidebar">
    <span>SCHEDULE</span>
    <span>GUIDE</span>
    <span class="on">STATUS</span>
    <span>LOG</span>
    <span>THREAD</span>
    <span>EXHIBIT</span>
    <span>IDEA</span>
    <span>DEV</span>
  </div>
  <div id="main">
    <h2 class="pixel-font cyan">STATUS - 전체보기</h2>
    <div class="filterbar">
      <input placeholder="검색 (ID · DIR · 사유)">
      <select><option>전체 판정</option></select>
      <select><option>전체 폴더</option></select>
      <button>LIVE LOAD</button>
      <button>DOWNLOAD</button>
      <button style="color:#ff5c9e;">DELETE</button>
    </div>
    <div class="statsbar">
      <span>전체 <b>6,422</b></span>
      <span>core <b>167</b></span>
      <span>support <b>374</b></span>
      <span>hold <b>222</b></span>
      <span>drop <b>5,659</b></span>
      <span>필터됨 <b>6,422</b></span>
    </div>
    <div class="grid scroll" id="grid"></div>
  </div>
</div>
<script>
const PHOTOS = [
  'DSCF6926','DSCF6926_1','DSCF6927','DSCF6928','DSCF6929','DSCF6932','DSCF6933','DSCF6934','DSCF6939',
  'DSCF6926','DSCF6927','DSCF6928'
];
const BASE = 'https://pub-ffca45bf1c204526a3de1b2315e479b3.r2.dev/2025/09/0928/';
const grid = document.getElementById('grid');
const VS = ['CORE','SUP','HOLD','DROP'];
grid.innerHTML = PHOTOS.map((id,i)=>`
  <div class="card">
    <div class="thumb"><img src="${BASE}t/${id}.jpg" onerror="this.style.display='none'"></div>
    <div class="id">${id}</div>
    <div class="vbtns">${VS.map((v,vi)=>`<span class="${vi===(i%4)?'on':''}">${v}</span>`).join('')}</div>
  </div>`).join('');
</script>
</body>
</html>
